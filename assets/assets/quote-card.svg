<svg width="100%" height="200" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Designed quote card</title>
  <desc>A navy card with a teal border, a large decorative quotation mark, an italicized quote reading Nevertheless, she persisted, and its attribution to Mitch McConnell below a cyan divider line</desc>
  <rect x="20" y="20" width="640" height="160" rx="14" fill="#0d1b2a" stroke="#64ffda" stroke-width="1"/>
  <rect x="30" y="30" width="620" height="140" rx="10" fill="none" stroke="#48cae4" stroke-width="0.5" opacity="0.5"/>
  <text x="55" y="80" font-family="Georgia, serif" font-size="60" fill="#64ffda" opacity="0.6">&#8220;</text>
  <text x="340" y="98" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#e8f1f2">Nevertheless, she persisted.</text>
  <line x1="290" y1="128" x2="390" y2="128" stroke="#48cae4" stroke-width="1"/>
  <text x="340" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#a8dadc">— Mitch McConnell</text>
</svg>
