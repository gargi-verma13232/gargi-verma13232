<svg width="100%" height="220" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Animated ocean divider graphic</title>
  <desc>Layered animated ocean waves in teal tones with a small fish swimming back and forth and bubbles rising to the surface</desc>
  <defs>
    <linearGradient id="deepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#123a4d"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="680" height="220" fill="url(#deepGrad)"/>
  <g opacity="0.85">
    <path fill="#1b4965">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="M0,150 C 90,130 190,170 290,150 C 390,130 480,170 580,150 C 620,140 660,150 680,145 L680,220 L0,220 Z;
                M0,160 C 90,180 190,140 290,160 C 390,180 480,140 580,160 C 620,170 660,160 680,165 L680,220 L0,220 Z;
                M0,150 C 90,130 190,170 290,150 C 390,130 480,170 580,150 C 620,140 660,150 680,145 L680,220 L0,220 Z"/>
    </path>
  </g>
  <g opacity="0.75">
    <path fill="#48cae4">
      <animate attributeName="d" dur="4.5s" repeatCount="indefinite"
        values="M0,175 C 90,160 190,190 290,175 C 390,160 480,190 580,175 C 620,170 660,175 680,172 L680,220 L0,220 Z;
                M0,185 C 90,200 190,170 290,185 C 390,200 480,170 580,185 C 620,190 660,185 680,188 L680,220 L0,220 Z;
                M0,175 C 90,160 190,190 290,175 C 390,160 480,190 580,175 C 620,170 660,175 680,172 L680,220 L0,220 Z"/>
    </path>
  </g>
  <g fill="#64ffda">
    <circle cx="70" cy="210" r="3" opacity="0.8"><animate attributeName="cy" values="210;30;210" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.8;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="210" r="2.5" opacity="0.7"><animate attributeName="cy" values="210;20;210" dur="5.5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.7;0" dur="5.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="210" r="4" opacity="0.6"><animate attributeName="cy" values="210;25;210" dur="6.5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0.6;0" dur="6.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="210" r="3" opacity="0.8"><animate attributeName="cy" values="210;30;210" dur="6s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.8;0" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="210" r="2" opacity="0.7"><animate attributeName="cy" values="210;35;210" dur="4.8s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.7;0" dur="4.8s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <path d="M0,-6 C 10,-9 20,-4 26,0 C 20,4 10,9 0,6 C 3,3 3,-3 0,-6 Z" fill="#64ffda" opacity="0.9">
      <animateMotion dur="9s" repeatCount="indefinite" path="M 40,60 C 200,30 400,90 640,50 C 400,20 200,80 40,60 Z"/>
    </path>
  </g>
</svg>
